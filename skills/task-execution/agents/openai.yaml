interface:
  display_name: "Task Execution"
  short_description: "Plan, execute, verify, and stop at the right scope"
  default_prompt: "Use $task-execution as the default execution harness for this actionable request. Calibrate rigor, bind completion to the narrowest justified target level, respect any authoritative product/work-control plane, stay in planning only until material unknowns are bounded, use relevant domain skills as specialists, verify claims with real evidence, distinguish required from optional findings, and stop when the current target is met. Never turn task/feature completion into a release or SHIP claim unless an explicit release target was evaluated and is release-ready."
