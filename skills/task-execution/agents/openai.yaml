interface:
  display_name: "Task Execution"
  short_description: "Close the current target with evidence and no residue"
  default_prompt: "Use $task-execution as the single HOST for this actionable request. Bind work to the narrowest justified current target, plan only until material unknowns are bounded, make the smallest coherent change, treat tests as evidence rather than output volume, remove temporary/obsolete artifacts, verify claims with task-appropriate evidence, classify remaining findings against the current target, satisfy repository delivery policy, and stop when Required work is closed. Load domain skills only when materially relevant; do not stack competing generic hosts."
