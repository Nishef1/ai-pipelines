interface:
  display_name: "Design Pipeline"
  short_description: "Choose a real design direction, build it, and judge the render"
  default_prompt: "Use $design-pipeline as the UI/UX DOMAIN skill for this material visual task. Share the host's current target. Ground in project truth, decide whether reference/design authority is sufficient, create/select a concrete direction before production coding when it is not, use at most one primary craft approach per build pass, inspect the real rendered states/viewports, use a fresh bounded visual judge when useful, keep functional/UX/brand/aesthetic verdicts separate, and return temporary/obsolete design artifacts for cleanup. Do not act as a second global execution host."
